<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مكتب تدريب الخريجين - جامعة طرابلس</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-wrap {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 50%;
            padding: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 14px;
            color: #93c5fd;
            margin-bottom: 30px;
        }
        .status-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-text {
            font-size: 15px;
            color: #e2e8f0;
            line-height: 1.6;
        }
        .btn-retry {
            display: none;
            margin-top: 18px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }
        .btn-retry:active {
            transform: scale(0.96);
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <img src="logo.jpg" alt="شعار مكتب تدريب الخريجين">
        </div>
        <h1>مكتب تدريب الخريجين</h1>
        <p class="subtitle">جامعة طرابلس - المنظومة الإلكترونية</p>

        <div class="status-box">
            <div class="spinner" id="loader"></div>
            <div class="status-text" id="status-message">جاري الاتصال بالمنظومة...</div>
            <button class="btn-retry" id="btn-retry" onclick="connect()">إعادة المحاولة</button>
        </div>
    </div>

    <script>
        const TARGET_URL = 'https://gto.com.ly';

        function showOffline() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('status-message').innerHTML = 'تعذر الاتصال بالإنترنت.<br>يرجى التحقق من الشبكة ثم إعادة المحاولة.';
            document.getElementById('btn-retry').style.display = 'inline-block';
        }

        function connect() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('status-message').textContent = 'جاري الاتصال بالمنظومة...';
            document.getElementById('btn-retry').style.display = 'none';

            if (!navigator.onLine) {
                setTimeout(showOffline, 400);
                return;
            }

            // Attempt navigation
            window.location.replace(TARGET_URL);

            // Fallback timeout in case page fails to load
            setTimeout(function() {
                if (window.location.href.indexOf('gto.com.ly') === -1) {
                    showOffline();
                }
            }, 6000);
        }

        window.addEventListener('online', connect);
        window.addEventListener('offline', showOffline);

        // Initial connect attempt
        window.addEventListener('DOMContentLoaded', connect);
    </script>
</body>
</html>
