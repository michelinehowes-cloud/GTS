# Nixpacks configuration for Laravel on Railway
providers = ["php", "node"]

[variables]
NIXPACKS_PHP_VERSION = "8.2"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
NIXPACKS_COMPOSER_INSTALL_FLAGS = "--no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs"

[phases.build]
cmds = [
    "npm run build",
    "php artisan storage:link || true"
]


