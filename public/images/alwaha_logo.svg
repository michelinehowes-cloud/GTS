<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
    <defs>
        <linearGradient id="wahaGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE68A" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <linearGradient id="wahaTeal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
    </defs>
    <!-- Logo Icon: Stylized Oasis / Palm & Exhibition Arches -->
    <g transform="translate(10, 8)">
        <!-- Outer Glowing Ring -->
        <circle cx="32" cy="32" r="30" stroke="url(#wahaGold)" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
        <circle cx="32" cy="32" r="26" fill="rgba(245,158,11,0.08)"/>
        
        <!-- Modern Exhibition Arch / Oasis curves -->
        <path d="M18 48 C 18 28, 46 28, 46 48" stroke="url(#wahaGold)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M24 48 C 24 35, 40 35, 40 48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        
        <!-- Palm Fronds / Rays -->
        <path d="M32 18 L32 30" stroke="url(#wahaGold)" stroke-width="3" stroke-linecap="round"/>
        <path d="M32 24 C 26 20, 22 23, 20 25" stroke="url(#wahaGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M32 24 C 38 20, 42 23, 44 25" stroke="url(#wahaGold)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="32" cy="15" r="3" fill="#FDE68A"/>
    </g>

    <!-- Text in Arabic -->
    <text x="82" y="34" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="900" font-size="20" letter-spacing="0.5">شركة الواحة</text>
    <text x="82" y="52" fill="#FDE68A" font-family="'Cairo', sans-serif" font-weight="700" font-size="12">لتنظيم المعارض والمؤتمرات</text>
    <text x="82" y="66" fill="rgba(255,255,255,0.7)" font-family="'Cairo', sans-serif" font-weight="600" font-size="9" letter-spacing="1">AL WAHA EXPO &amp; CONFERENCES</text>
</svg>
