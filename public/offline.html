<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e5ab8">
    <title>لا يوجد اتصال بالإنترنت — مكتب تدريب الخريجين</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(160deg, #1e5ab8 0%, #2b82d8 100%);
            color: #1e293b;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: #1e5ab8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo img { width: 56px; height: 56px; object-fit: contain; }
        .icon { font-size: 40px; margin-bottom: 6px; }
        h1 { font-size: 1.25rem; margin: 6px 0 8px; }
        p { color: #64748b; line-height: 1.7; margin: 0 0 20px; font-size: 0.95rem; }
        .btn {
            display: block;
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 0;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 10px;
        }
        .btn-primary { background: #1e5ab8; color: #fff; }
        .btn-secondary { background: #fef3c7; color: #92400e; }
        .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo"><img src="/images/office_logo_white.png" alt="شعار مكتب تدريب الخريجين" onerror="this.remove()"></div>
        <div class="icon" aria-hidden="true">📶</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تحقق من اتصال الشبكة أو البيانات، ثم أعد المحاولة. ستعود الصفحة تلقائياً عند رجوع الاتصال.</p>

        <button type="button" class="btn btn-primary" onclick="location.reload()">إعادة المحاولة</button>
        <a href="/graduate/id-card" class="btn btn-secondary" id="cardLink" hidden>🪪 عرض بطاقتي الرقمية (بدون إنترنت)</a>

        <div class="hint">مكتب تدريب الخريجين — جامعة طرابلس</div>
    </main>

    <script>
        // Offer the saved ID card when one is available on this device
        if ('caches' in window) {
            caches.keys().then(function (keys) {
                var privateCache = keys.filter(function (k) { return k.indexOf('gto-private-') === 0; })[0];
                if (!privateCache) return;
                caches.open(privateCache).then(function (c) { return c.match('/graduate/id-card'); }).then(function (r) {
                    if (r) document.getElementById('cardLink').hidden = false;
                });
            });
        }
        // Reload automatically when the connection comes back
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
