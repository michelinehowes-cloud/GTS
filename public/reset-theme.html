<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين الوضع</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .success {
            color: #10b981;
            display: none;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌙 إعادة تعيين الوضع</h1>
        <p>اضغط على الزر لإعادة تعيين إعدادات الوضع الليلي</p>
        <button onclick="resetTheme()">إعادة التعيين</button>
        <p class="success" id="success">✅ تم إعادة التعيين بنجاح!</p>
    </div>

    <script>
        function resetTheme() {
            // Clear theme from localStorage
            localStorage.removeItem('theme');

            // Show success message
            document.getElementById('success').style.display = 'block';

            // Reload after 1 second
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }
    </script>
</body>

</html>
